    strategy: "pyramid"
    loss_limit: 2
    comment: ""
  EDDM:
    city: "Munich"
    strategy: "pyramid"
    loss_limit: 2
    comment: ""
  KSEA:
    city: "Seattle"
    strategy: "pyramid"
    loss_limit: 2
    comment: ""
  CYYZ:
    city: "Toronto"
    strategy: "pyramid"
    loss_limit: 2
    min_price_limit: 35
    comment: ""
  VILK:
    city: "Lucknow"
    strategy: "pyramid"
    loss_limit: 2
    comment: ""
